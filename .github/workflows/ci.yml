name: CI

# The required check. It runs exactly the gate a stage runs locally
# (scripts/agent/verify.sh), so "green here" and "green in the session" mean the
# same thing. Make this the required status check on main — see the onboarding PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Bootstrap
        run: bash scripts/agent/bootstrap.sh

      - name: Verification gate
        run: bash scripts/agent/verify.sh

      - name: Full QA (serves site/ and checks every asset over HTTP)
        run: bash scripts/agent/qa.sh

      - name: Pipeline doctor
        run: python3 .agent-kit/plugin/scripts/doctor.py
